name: ice-king

services:
  # 1. Contenedor de la Aplicación (PHP)
  app:
    build:
      context: .
      dockerfile: ./docker/app/Dockerfile
    container_name: ice_king_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - ice_king_net
    deploy:
      resources:
        limits:
          cpus: '0.50'     # Máximo medio núcleo
          memory: 512M     # Tope máximo de RAM
        reservations:
          cpus: '0.10'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 2. Contenedor del Servidor Web (Nginx)
  web:
    image: nginx:alpine
    container_name: ice_king_web
    restart: unless-stopped
    volumes:
      - ./:/var/www
      - ./docker/nginx/app.conf:/etc/nginx/conf.d/default.conf
    networks:
      - ice_king_net
      - public_network
    depends_on:
      - app
    deploy:
      resources:
        limits:
          cpus: '0.25'     # Nginx consume muy poco
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 3. Contenedor de Base de Datos (MySQL)
  db:
    image: mysql:8.0
    container_name: ice_king_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
    #ports:
    # - "${FORWARD_DB_PORT:-3306}:3306"
    volumes:
      - ice_king_mysql:/var/lib/mysql
    networks:
      - ice_king_net
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 768M     # Base de datos necesita más holgura
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  cron:
    build:
      context: .
      dockerfile: ./docker/app/Dockerfile
    container_name: ice_king_cron
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    command: sh -c "while true; do php artisan schedule:run --no-interaction & sleep 60; done"
    networks:
      - ice_king_net
    depends_on:
      - db
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

networks:
  ice_king_net:
    driver: bridge
  public_network:
    external: true
volumes:
  ice_king_mysql:
    driver: local