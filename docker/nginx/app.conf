server {
    listen 80;
    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/public;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        image/svg+xml;

    # Service worker y manifest de la PWA: NUNCA deben cachearse a largo plazo.
    # El navegador tiene que poder detectar una nueva versión del SW en cada
    # visita, o la PWA instalada se queda pegada en una versión vieja del sitio
    # hasta que el usuario borre datos manualmente.
    location ~* (service-worker\.js|sw\.js|manifest\.json|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Assets del build de Vite (JS/CSS/fuentes/imágenes). Vite les agrega un
    # hash al nombre de archivo en cada build, así que si el contenido cambia,
    # cambia la URL. Por eso es seguro cachearlos "para siempre" en el
    # navegador: nunca vas a servir contenido viejo bajo una URL que ya cambió.
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }
}