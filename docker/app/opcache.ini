; Configuración de OPcache para producción (Laravel + Docker)
; Se copia dentro de la imagen en /usr/local/etc/php/conf.d/opcache.ini

opcache.enable=1
opcache.enable_cli=1

; Memoria reservada para el código pre-compilado (en MB)
opcache.memory_consumption=128

; Buffer para strings internados (reduce uso de memoria en strings repetidos)
opcache.interned_strings_buffer=8

; Debe ser mayor al total de archivos .php del proyecto (app/ + vendor/).
; Verificar con: find /var/www -name "*.php" | wc -l
opcache.max_accelerated_files=20000

; CRÍTICO EN PRODUCCIÓN: no revalidar timestamps de archivos en cada request.
; El código no cambia entre deploys, así que PHP no debe perder tiempo
; comprobando si los archivos fueron modificados.
; Efecto colateral: tras cada deploy hay que limpiar OPcache manualmente
; (php artisan opcache:clear o reiniciar el contenedor "app").
opcache.validate_timestamps=0

; Libera memoria más rápido al cerrar el request
opcache.fast_shutdown=1