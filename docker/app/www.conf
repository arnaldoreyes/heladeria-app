; Pool de PHP-FPM, ajustado al límite real del contenedor (0.50 CPU / 512M RAM).
; Reemplaza el www.conf default de la imagen php:8.4-fpm.

[www]
user = www-data
group = www-data

listen = 9000
listen.owner = www-data
listen.group = www-data

; "dynamic": arranca con pocos workers y escala bajo demanda hasta max_children.
; Con 0.5 CPU no ganas throughput real por tener muchos workers en paralelo
; (el cuello de botella es CPU, no concurrencia), pero sí necesitas margen
; para no encolar requests durante picos cortos (varias ventas seguidas en el POS).
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Evita que un worker atascado (ej. request colgado esperando el scraper del BCV
; con timeout de 10s) se quede vivo indefinidamente y bloquee un slot del pool.
pm.max_requests = 500
request_terminate_timeout = 30s

; Logs del pool (útiles para diagnosticar saturación del pool más adelante)
access.log = /proc/self/fd/2
slowlog = /proc/self/fd/2
request_slowlog_timeout = 5s